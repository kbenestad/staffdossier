<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>Staff Dossier</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="assets/site.webmanifest">
<meta name="theme-color" content="#2f6fed">

<script>
  (function(){var t=localStorage.getItem('kb-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
</script>

<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/ui.css">
<script src="assets/app.js"></script>

<style>
/* ── Tab navigation ─────────────────────────────────────────────── */
.staffdossier-tabs {
  display: flex; gap: 2px; flex-wrap: wrap;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
}
.staffdossier-tab {
  padding: 9px 18px; font: 600 var(--fs-small)/1 var(--font-sans);
  color: var(--text-muted); background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
  cursor: pointer; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  white-space: nowrap; transition: color .12s;
}
.staffdossier-tab:hover { color: var(--text); }
.staffdossier-tab.is-active {
  color: var(--accent); border-bottom-color: var(--accent);
  background: var(--accent-soft);
}
.staffdossier-tab-content > div { display: none; }
.staffdossier-tab-content > div.is-active { display: block; }

/* ── Action rows ────────────────────────────────────────────────── */
.staffdossier-top-actions {
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap;
}
.staffdossier-top-actions .spacer { flex: 1; }
/* Gap between bottom actions and footer */
.kb-actions { margin-bottom: 24px; }

/* ── Photo preview ──────────────────────────────────────────────── */
.staffdossier-photo-area {
  display: flex; align-items: flex-start; gap: 16px;
  margin-bottom: 16px;
}
.staffdossier-photo-preview {
  width: 88px; height: 113px;
  border: 2px dashed var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface-3); display: flex; align-items: center;
  justify-content: center; overflow: hidden; flex-shrink: 0;
}
.staffdossier-photo-preview img { width: 100%; height: 100%; object-fit: cover; }
.staffdossier-photo-preview .placeholder {
  font-size: 11px; color: var(--text-muted); text-align: center; padding: 8px;
}
.staffdossier-photo-btns { display: flex; flex-direction: column; gap: 8px; }

/* ── Scan preview ───────────────────────────────────────────────── */
.staffdossier-scan-preview {
  width: 100%; border-radius: var(--radius-sm);
  border: 1px solid var(--border); overflow: hidden; margin-top: 8px;
}
.staffdossier-scan-preview img { width: 100%; display: block; }

/* ── Repeating rows ─────────────────────────────────────────────── */
.staffdossier-repeating-row {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.staffdossier-repeating-row:last-of-type { border-bottom: none; }
.staffdossier-repeating-row .kb-grid { flex: 1; }
.staffdossier-repeating-row .rm-btn { margin-bottom: 2px; flex-shrink: 0; }
.staffdossier-add-row { margin-top: 10px; }

/* ── Validity badge ─────────────────────────────────────────────── */
.staffdossier-validity {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: var(--radius-pill);
  font-size: var(--fs-small); font-weight: 700; margin: 6px 0 10px;
}
.staffdossier-validity--ok {
  background: var(--success-soft); border: 1px solid var(--success-border);
  color: var(--success);
}
.staffdossier-validity--warn {
  background: var(--warning-soft); border: 1px solid var(--warning-border);
  color: var(--warning);
}
.staffdossier-validity--expired {
  background: var(--danger-soft); border: 1px solid var(--danger-border);
  color: var(--danger);
}
.staffdossier-validity--none {
  background: var(--surface-3); border: 1px solid var(--border-strong);
  color: var(--text-muted);
}

/* ── Document entry card header ─────────────────────────────────── */
.staffdossier-doc-header {
  display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px;
}
.staffdossier-doc-header .kb-field { flex: 1; }

/* ── Cropper modal ──────────────────────────────────────────────── */
.staffdossier-crop-modal {
  max-width: min(760px, 96vw) !important;
  width: min(760px, 96vw) !important;
}
.staffdossier-crop-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; padding: 4px 0;
}
.staffdossier-crop-canvas {
  max-width: 100%; cursor: crosshair; touch-action: none;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  display: block;
}
.staffdossier-crop-rot {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
}

/* ── Span full cols ─────────────────────────────────────────────── */
.col-span-2 { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="app"><p class="kb-loading">Loading configuration…</p></div>

<!-- Hidden file inputs -->
<input type="file" id="photo-file-input" accept="image/*" style="display:none">
<input type="file" id="scan-file-input" accept="image/*" style="display:none">
<input type="file" id="load-file-input" accept=".html" style="display:none">

<script>
(async function () {
'use strict';

let CFG;
let lang = 'en';

// ── State ──────────────────────────────────────────────────────────────────
let state = emptyState();

function emptyState() {
  return {
    personal: {
      name: '', email: '', phone: '',
      address: { line1: '', city: '', province: '', postalCode: '', country: '' },
      photo: null,
      education: [],
      workHistory: [],
      emergencyContact: { name: '', relationship: '', phone: '', email: '' }
    },
    employment: {
      hireDate: '', probationEnd: '', contractType: '',
      currentRole: '', roleHistory: [],
      terminationDate: '', terminationReason: '',
      eligibleForRehire: ''
    },
    documents: [],
    reviews: [],
    documentLinks: []
  };
}

// ── i18n ───────────────────────────────────────────────────────────────────
function S(key, vars) {
  return lookupString(CFG['ui-strings'], key, lang, CFG['default-code'], vars);
}

function assertValidConfig(cfg) {
  if (!cfg || typeof cfg !== 'object' || !cfg.localisation)
    throw new Error(
      'config.yml loaded but did not parse to a valid configuration. The server ' +
      'most likely returned an HTML page (a 404 or single-page-app fallback, or a ' +
      'stale cached page) instead of the YAML file. Confirm config.yml is deployed ' +
      'next to index.html and served as plain text (not rewritten to index.html).'
    );
}

function normaliseConfig() {
  const loc = CFG && CFG.localisation;
  if (!loc) return;
  const { table, languages, defaultCode } = buildLangTable(loc);
  CFG['default-code'] = defaultCode;
  CFG.languages = CFG.languages || languages;
  CFG['ui-strings'] = table;
}

function applyLang(lc) {
  lang = lc;
  const loc = CFG.localisation || {};
  const a = (loc[lc] && loc[lc].about) || (loc[CFG['default-code']] && loc[CFG['default-code']].about) || {};
  CFG['about-title']   = a.title   || 'About';
  CFG['about-content'] = a.content || '';
  CFG['about-button']  = a.button  || 'Close';
}

function showAboutModal() {
  return kbAbout({ title: CFG['about-title'], contentMD: CFG['about-content'], closeLabel: CFG['about-button'] });
}

// ── DOM helpers ────────────────────────────────────────────────────────────
function field(label, input, opts) {
  const f = el('div', { className: 'kb-field' + (opts && opts.full ? ' col-span-2' : '') });
  f.append(el('span', { className: 'kb-label' }, label), input);
  return f;
}

function mkInput(attrs) {
  return el('input', Object.assign({ className: 'kb-input' }, attrs));
}

function mkSelect(options, value, onChange) {
  const sel = el('select', { className: 'kb-select' });
  sel.appendChild(el('option', { value: '' }, ''));
  options.forEach(opt => {
    const o = el('option', { value: opt }, opt);
    if (opt === value) o.selected = true;
    sel.appendChild(o);
  });
  if (onChange) sel.addEventListener('change', onChange);
  return sel;
}

function mkTextarea(attrs) {
  return el('textarea', Object.assign({ className: 'kb-textarea' }, attrs));
}

function circRm(onClick) {
  const b = el('button', { type: 'button', className: 'kb-circbtn kb-circbtn--rm rm-btn', title: S('btn-remove'), onClick });
  b.textContent = '×';
  return b;
}

function addRowBtn(label, onClick) {
  return el('button', { type: 'button', className: 'kb-btn kb-btn--dashed kb-btn--sm staffdossier-add-row', onClick }, label);
}

// ── Tab builder ────────────────────────────────────────────────────────────
function makeTabs(tabs) {
  const strip = el('div', { className: 'staffdossier-tabs' });
  const content = el('div', { className: 'staffdossier-tab-content' });
  const panes = tabs.map(() => { const p = el('div'); content.appendChild(p); return p; });
  tabs.forEach((t, i) => {
    const btn = el('button', { type: 'button', className: 'staffdossier-tab' + (i === 0 ? ' is-active' : '') }, t.label);
    btn.addEventListener('click', () => {
      strip.querySelectorAll('.staffdossier-tab').forEach((b, j) => {
        b.classList.toggle('is-active', j === i);
        panes[j].classList.toggle('is-active', j === i);
      });
      if (!panes[i]._built) { panes[i]._built = true; panes[i].appendChild(t.build()); }
    });
    strip.appendChild(btn);
  });
  panes[0]._built = true;
  panes[0].appendChild(tabs[0].build());
  panes[0].classList.add('is-active');
  const wrap = el('div');
  wrap.append(strip, content);
  return wrap;
}

// ── Validity helper ────────────────────────────────────────────────────────
function validityBadge(expiryDate, warningMonths) {
  const badge = el('div');
  if (!expiryDate) {
    badge.className = 'staffdossier-validity staffdossier-validity--none';
    badge.textContent = S('no-expiry');
    return badge;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(expiryDate + 'T00:00:00');
  const warnMs = (warningMonths || 3) * 30.44 * 86400000;
  if (exp < today) {
    badge.className = 'staffdossier-validity staffdossier-validity--expired';
    badge.textContent = S('label-expired') + ' — ' + formatDate(expiryDate);
  } else if (exp - today < warnMs) {
    badge.className = 'staffdossier-validity staffdossier-validity--warn';
    badge.textContent = S('label-expiring-soon') + ' — ' + formatDate(expiryDate);
  } else {
    badge.className = 'staffdossier-validity staffdossier-validity--ok';
    badge.textContent = S('label-expires') + ' ' + formatDate(expiryDate);
  }
  return badge;
}

// ── Personal tab ───────────────────────────────────────────────────────────
function buildPersonalTab() {
  const wrap = el('div');

  // Photo + Personal info card
  const photoCard = el('div', { className: 'kb-card' });
  photoCard.appendChild(el('div', { className: 'kb-card__title' }, S('section-personal')));

  const photoArea = el('div', { className: 'staffdossier-photo-area' });
  const preview = el('div', { className: 'staffdossier-photo-preview', id: 'photo-preview-box' });
  if (state.personal.photo) {
    preview.appendChild(el('img', { src: state.personal.photo, alt: '' }));
  } else {
    preview.appendChild(el('span', { className: 'placeholder' }, S('field-photo')));
  }
  const photoBtns = el('div', { className: 'staffdossier-photo-btns' });
  if (state.personal.photo) {
    photoBtns.appendChild(el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm',
      onClick: () => openCropper('photo') }, S('btn-crop-photo')));
  } else {
    photoBtns.appendChild(el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm',
      onClick: () => document.getElementById('photo-file-input').click() }, S('btn-upload-photo')));
  }
  photoArea.append(preview, photoBtns);
  photoCard.appendChild(photoArea);

  const grid = el('div', { className: 'kb-grid cols-2' });

  const nameIn = mkInput({ value: state.personal.name, placeholder: S('field-name') });
  nameIn.addEventListener('input', e => { state.personal.name = e.target.value; });
  grid.appendChild(field(S('field-name'), nameIn, { full: true }));

  const emailIn = mkInput({ type: 'email', value: state.personal.email });
  emailIn.addEventListener('input', e => { state.personal.email = e.target.value; });
  grid.appendChild(field(S('field-email'), emailIn));

  const phoneIn = mkInput({ type: 'tel', value: state.personal.phone });
  phoneIn.addEventListener('input', e => { state.personal.phone = e.target.value; });
  grid.appendChild(field(S('field-phone'), phoneIn));

  // Address: 4 text fields + country dropdown
  const addr = state.personal.address;
  const line1In = mkInput({ value: addr.line1 });
  line1In.addEventListener('input', e => { state.personal.address.line1 = e.target.value; });
  grid.appendChild(field(S('field-address-line1'), line1In, { full: true }));

  const cityIn = mkInput({ value: addr.city });
  cityIn.addEventListener('input', e => { state.personal.address.city = e.target.value; });
  grid.appendChild(field(S('field-address-city'), cityIn));

  const provIn = mkInput({ value: addr.province });
  provIn.addEventListener('input', e => { state.personal.address.province = e.target.value; });
  grid.appendChild(field(S('field-address-province'), provIn));

  const postalIn = mkInput({ value: addr.postalCode });
  postalIn.addEventListener('input', e => { state.personal.address.postalCode = e.target.value; });
  grid.appendChild(field(S('field-address-postal'), postalIn));

  const countrySel = mkSelect(CFG['countries'] || [], addr.country,
    e => { state.personal.address.country = e.target.value; });
  grid.appendChild(field(S('field-address-country'), countrySel));

  photoCard.appendChild(grid);
  wrap.appendChild(photoCard);

  wrap.appendChild(buildEducationCard());
  wrap.appendChild(buildWorkHistoryCard());
  wrap.appendChild(buildEmergencyCard());

  return wrap;
}

function buildEducationCard() {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(el('div', { className: 'kb-card__title' }, S('section-education')));
  const rows = el('div', { id: 'education-rows' });
  state.personal.education.forEach((_, i) => rows.appendChild(buildEducationRow(i)));
  card.appendChild(rows);
  card.appendChild(addRowBtn(S('btn-add-education'), () => {
    state.personal.education.push({ institution: '', qualification: '', year: '' });
    rows.appendChild(buildEducationRow(state.personal.education.length - 1));
  }));
  return card;
}

function buildEducationRow(i) {
  const row = el('div', { className: 'staffdossier-repeating-row' });
  const grid = el('div', { className: 'kb-grid cols-3' });
  const instIn = mkInput({ value: state.personal.education[i].institution });
  instIn.addEventListener('input', e => { state.personal.education[i].institution = e.target.value; });
  const qualIn = mkInput({ value: state.personal.education[i].qualification });
  qualIn.addEventListener('input', e => { state.personal.education[i].qualification = e.target.value; });
  const yearIn = mkInput({ value: state.personal.education[i].year });
  yearIn.addEventListener('input', e => { state.personal.education[i].year = e.target.value; });
  grid.append(
    field(S('field-institution'), instIn),
    field(S('field-qualification'), qualIn),
    field(S('field-year'), yearIn)
  );
  row.append(grid, circRm(() => { state.personal.education.splice(i, 1); row.remove(); }));
  return row;
}

function buildWorkHistoryCard() {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(el('div', { className: 'kb-card__title' }, S('section-workhistory')));
  const rows = el('div', { id: 'workhistory-rows' });
  state.personal.workHistory.forEach((_, i) => rows.appendChild(buildWorkHistoryRow(i)));
  card.appendChild(rows);
  card.appendChild(addRowBtn(S('btn-add-workhistory'), () => {
    state.personal.workHistory.push({ employer: '', role: '', from: '', to: '' });
    rows.appendChild(buildWorkHistoryRow(state.personal.workHistory.length - 1));
  }));
  return card;
}

function buildWorkHistoryRow(i) {
  const row = el('div', { className: 'staffdossier-repeating-row' });
  const grid = el('div', { className: 'kb-grid cols-4' });
  const empIn = mkInput({ value: state.personal.workHistory[i].employer });
  empIn.addEventListener('input', e => { state.personal.workHistory[i].employer = e.target.value; });
  const roleIn = mkInput({ value: state.personal.workHistory[i].role });
  roleIn.addEventListener('input', e => { state.personal.workHistory[i].role = e.target.value; });
  const fromIn = mkInput({ type: 'date', value: state.personal.workHistory[i].from });
  fromIn.addEventListener('input', e => { state.personal.workHistory[i].from = e.target.value; });
  const toIn = mkInput({ type: 'date', value: state.personal.workHistory[i].to });
  toIn.addEventListener('input', e => { state.personal.workHistory[i].to = e.target.value; });
  grid.append(
    field(S('field-employer'), empIn),
    field(S('field-role'), roleIn),
    field(S('field-from'), fromIn),
    field(S('field-to'), toIn)
  );
  row.append(grid, circRm(() => { state.personal.workHistory.splice(i, 1); row.remove(); }));
  return row;
}

function buildEmergencyCard() {
  const card = el('div', { className: 'kb-card' });
  card.appendChild(el('div', { className: 'kb-card__title' }, S('section-emergency')));
  const grid = el('div', { className: 'kb-grid cols-2' });
  const ec = state.personal.emergencyContact;

  const nameIn = mkInput({ value: ec.name });
  nameIn.addEventListener('input', e => { ec.name = e.target.value; });
  grid.appendChild(field(S('field-ec-name'), nameIn));

  const relIn = mkInput({ value: ec.relationship });
  relIn.addEventListener('input', e => { ec.relationship = e.target.value; });
  grid.appendChild(field(S('field-ec-relationship'), relIn));

  const phoneIn = mkInput({ type: 'tel', value: ec.phone });
  phoneIn.addEventListener('input', e => { ec.phone = e.target.value; });
  grid.appendChild(field(S('field-ec-phone'), phoneIn));

  const emailIn = mkInput({ type: 'email', value: ec.email });
  emailIn.addEventListener('input', e => { ec.email = e.target.value; });
  grid.appendChild(field(S('field-ec-email'), emailIn));

  card.appendChild(grid);
  return card;
}

// ── Employment tab ─────────────────────────────────────────────────────────
function buildEmploymentTab() {
  const wrap = el('div');

  const empCard = el('div', { className: 'kb-card' });
  empCard.appendChild(el('div', { className: 'kb-card__title' }, S('section-employment')));
  const grid = el('div', { className: 'kb-grid cols-2' });

  const hireDateIn = mkInput({ type: 'date', value: state.employment.hireDate });
  hireDateIn.addEventListener('input', e => { state.employment.hireDate = e.target.value; });
  grid.appendChild(field(S('field-hire-date'), hireDateIn));

  const probIn = mkInput({ type: 'date', value: state.employment.probationEnd });
  probIn.addEventListener('input', e => { state.employment.probationEnd = e.target.value; });
  grid.appendChild(field(S('field-probation-end'), probIn));

  const contractSel = mkSelect(CFG['contract-types'] || [], state.employment.contractType,
    e => { state.employment.contractType = e.target.value; });
  grid.appendChild(field(S('field-contract-type'), contractSel));

  const roleSel = mkSelect(CFG['roles'] || [], state.employment.currentRole,
    e => { state.employment.currentRole = e.target.value; });
  grid.appendChild(field(S('field-current-role'), roleSel));

  const rehireSel = mkSelect(['Yes', 'No'], state.employment.eligibleForRehire,
    e => { state.employment.eligibleForRehire = e.target.value; });
  grid.appendChild(field(S('field-eligible-rehire'), rehireSel));

  empCard.appendChild(grid);
  wrap.appendChild(empCard);

  const roleHistCard = el('div', { className: 'kb-card' });
  roleHistCard.appendChild(el('div', { className: 'kb-card__title' }, S('section-role-history')));
  const roleRows = el('div', { id: 'role-history-rows' });
  state.employment.roleHistory.forEach((_, i) => roleRows.appendChild(buildRoleHistoryRow(i)));
  roleHistCard.appendChild(roleRows);
  roleHistCard.appendChild(addRowBtn(S('btn-add-role'), () => {
    state.employment.roleHistory.push({ role: '', from: '', to: '' });
    roleRows.appendChild(buildRoleHistoryRow(state.employment.roleHistory.length - 1));
  }));
  wrap.appendChild(roleHistCard);

  const termCard = el('div', { className: 'kb-card' });
  termCard.appendChild(el('div', { className: 'kb-card__title' }, S('section-termination')));
  const termGrid = el('div', { className: 'kb-grid cols-2' });

  const termDateIn = mkInput({ type: 'date', value: state.employment.terminationDate });
  termDateIn.addEventListener('input', e => { state.employment.terminationDate = e.target.value; });
  termGrid.appendChild(field(S('field-termination-date'), termDateIn));

  const termReasonIn = mkTextarea({ rows: 3, placeholder: S('ph-termination-reason') });
  termReasonIn.value = state.employment.terminationReason;
  termReasonIn.addEventListener('input', e => { state.employment.terminationReason = e.target.value; });
  termGrid.appendChild(field(S('field-termination-reason'), termReasonIn, { full: true }));

  termCard.appendChild(termGrid);
  wrap.appendChild(termCard);

  return wrap;
}

function buildRoleHistoryRow(i) {
  const row = el('div', { className: 'staffdossier-repeating-row' });
  const grid = el('div', { className: 'kb-grid cols-3' });
  const roleSel = mkSelect(CFG['roles'] || [], state.employment.roleHistory[i].role,
    e => { state.employment.roleHistory[i].role = e.target.value; });
  const fromIn = mkInput({ type: 'date', value: state.employment.roleHistory[i].from });
  fromIn.addEventListener('input', e => { state.employment.roleHistory[i].from = e.target.value; });
  const toIn = mkInput({ type: 'date', value: state.employment.roleHistory[i].to });
  toIn.addEventListener('input', e => { state.employment.roleHistory[i].to = e.target.value; });
  grid.append(
    field(S('field-role'), roleSel),
    field(S('field-role-from'), fromIn),
    field(S('field-role-to'), toIn)
  );
  row.append(grid, circRm(() => { state.employment.roleHistory.splice(i, 1); row.remove(); }));
  return row;
}

// ── Documents tab ──────────────────────────────────────────────────────────
function buildDocumentsTab() {
  const wrap = el('div');
  const docsContainer = el('div', { id: 'docs-container' });
  state.documents.forEach((_, i) => docsContainer.appendChild(buildDocumentEntry(i)));
  wrap.appendChild(docsContainer);
  wrap.appendChild(addRowBtn(S('btn-add-document'), () => {
    state.documents.push({ type: '', number: '', issueDate: '', issueAuthority: '', expiryDate: '', scan: null });
    docsContainer.appendChild(buildDocumentEntry(state.documents.length - 1));
  }));
  return wrap;
}

function buildDocumentEntry(i) {
  const card = el('div', { className: 'kb-card', 'data-doc-idx': i });
  const docTypes = (CFG['document-types'] || []).map(d => d.label);

  const hdr = el('div', { className: 'staffdossier-doc-header' });
  const typeSel = mkSelect(docTypes, state.documents[i].type, e => {
    state.documents[i].type = e.target.value;
    refreshValidityBadge(card, i);
  });
  hdr.append(field(S('field-doc-type'), typeSel), circRm(() => {
    state.documents.splice(i, 1);
    card.remove();
  }));
  card.appendChild(hdr);

  const badgeWrap = el('div', { className: 'validity-wrap' });
  badgeWrap.appendChild(validityBadge(state.documents[i].expiryDate, getWarningMonths(state.documents[i].type)));
  card.appendChild(badgeWrap);

  const grid = el('div', { className: 'kb-grid cols-2' });

  const numIn = mkInput({ value: state.documents[i].number });
  numIn.addEventListener('input', e => { state.documents[i].number = e.target.value; });
  grid.appendChild(field(S('field-doc-number'), numIn));

  const issueDateIn = mkInput({ type: 'date', value: state.documents[i].issueDate });
  issueDateIn.addEventListener('input', e => { state.documents[i].issueDate = e.target.value; });
  grid.appendChild(field(S('field-doc-issue-date'), issueDateIn));

  const authIn = mkInput({ value: state.documents[i].issueAuthority });
  authIn.addEventListener('input', e => { state.documents[i].issueAuthority = e.target.value; });
  grid.appendChild(field(S('field-doc-issue-authority'), authIn));

  const expiryIn = mkInput({ type: 'date', value: state.documents[i].expiryDate });
  expiryIn.addEventListener('input', e => {
    state.documents[i].expiryDate = e.target.value;
    refreshValidityBadge(card, i);
  });
  grid.appendChild(field(S('field-doc-expiry'), expiryIn));
  card.appendChild(grid);

  const scanArea = el('div', { className: 'scan-area', id: 'scan-area-' + i });
  refreshScanArea(scanArea, i);
  card.appendChild(scanArea);

  return card;
}

function getWarningMonths(typeLabel) {
  const dt = (CFG['document-types'] || []).find(d => d.label === typeLabel);
  return dt ? (dt['warning-months'] || 3) : 3;
}

function refreshValidityBadge(card, i) {
  const wrap = card.querySelector('.validity-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  wrap.appendChild(validityBadge(state.documents[i].expiryDate, getWarningMonths(state.documents[i].type)));
}

function refreshScanArea(scanArea, i) {
  scanArea.innerHTML = '';
  if (state.documents[i].scan) {
    const preview = el('div', { className: 'staffdossier-scan-preview' });
    preview.appendChild(el('img', { src: state.documents[i].scan, alt: '' }));
    scanArea.appendChild(preview);
    scanArea.appendChild(el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm',
      style: { marginTop: '8px' },
      onClick: () => openCropper('document', i) }, S('btn-crop-scan')));
  } else {
    scanArea.appendChild(el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm',
      onClick: () => { _pendingScanIdx = i; document.getElementById('scan-file-input').click(); } },
      S('btn-upload-scan')));
  }
}

// ── Cropper ────────────────────────────────────────────────────────────────
let _pendingScanIdx = null;

document.getElementById('photo-file-input').addEventListener('change', function() {
  const f = this.files[0];
  if (f) openCropperWithFile(f, 'photo', null);
  this.value = '';
});
document.getElementById('scan-file-input').addEventListener('change', function() {
  const f = this.files[0];
  if (f) openCropperWithFile(f, 'document', _pendingScanIdx);
  this.value = '';
});

function getDocAspect(docIdx) {
  if (docIdx == null) return 85.6 / 54;
  const typeLabel = state.documents[docIdx] && state.documents[docIdx].type;
  const dt = (CFG['document-types'] || []).find(d => d.label === typeLabel);
  if (dt && dt['aspect-ratio']) { const [w, h] = dt['aspect-ratio']; return w / h; }
  return 85.6 / 54;
}

function openCropper(mode, docIdx) {
  const src = mode === 'photo' ? state.personal.photo : (state.documents[docIdx] && state.documents[docIdx].scan);
  if (!src) return;
  openCropperWithSrc(src, mode, docIdx);
}

function openCropperWithFile(file, mode, docIdx) {
  const reader = new FileReader();
  reader.onload = e => openCropperWithSrc(e.target.result, mode, docIdx);
  reader.readAsDataURL(file);
}

function openCropperWithSrc(src, mode, docIdx) {
  const aspect = mode === 'photo'
    ? (()=>{ const [w,h]=CFG['photo-aspect-ratio']||[35,45]; return w/h; })()
    : getDocAspect(docIdx);
  const title = mode === 'photo' ? S('crop-title-photo') : S('crop-title-doc');

  const img = new Image();
  img.onload = () => {
    const MAX_W = 680, MAX_H = 500;
    let cw, ch, scaleX, scaleY;
    let rotationDeg = 0;

    function updateSize() {
      const rad = rotationDeg * Math.PI / 180;
      const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const rw = nw * cos + nh * sin, rh = nw * sin + nh * cos;
      const s = Math.min(MAX_W / rw, MAX_H / rh, 1);
      cw = Math.round(rw * s); ch = Math.round(rh * s);
      scaleX = rw / cw; scaleY = rh / ch;
    }
    updateSize();

    const canvas = el('canvas', { className: 'staffdossier-crop-canvas', width: cw, height: ch });
    const ctx = canvas.getContext('2d');

    let crop = fitCrop(cw, ch, aspect);
    let drag = null;

    function draw() {
      ctx.clearRect(0, 0, cw, ch);
      ctx.save();
      ctx.translate(cw / 2, ch / 2);
      ctx.rotate(rotationDeg * Math.PI / 180);
      ctx.drawImage(img, -img.naturalWidth / scaleX / 2, -img.naturalHeight / scaleY / 2,
        img.naturalWidth / scaleX, img.naturalHeight / scaleY);
      ctx.restore();
      ctx.beginPath();
      ctx.rect(0, 0, cw, ch);
      ctx.rect(crop.x, crop.y, crop.w, crop.h);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fill('evenodd');
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);
      const hs = 8;
      ctx.fillStyle = '#fff';
      [[crop.x, crop.y],[crop.x+crop.w, crop.y],[crop.x, crop.y+crop.h],[crop.x+crop.w, crop.y+crop.h]].forEach(([hx,hy]) => {
        ctx.fillRect(hx - hs/2, hy - hs/2, hs, hs);
      });
    }
    draw();

    function hitTest(mx, my) {
      const hs = 10;
      const corners = [
        { name: 'nw', x: crop.x,        y: crop.y },
        { name: 'ne', x: crop.x+crop.w, y: crop.y },
        { name: 'sw', x: crop.x,        y: crop.y+crop.h },
        { name: 'se', x: crop.x+crop.w, y: crop.y+crop.h },
      ];
      for (const c of corners) {
        if (Math.abs(mx - c.x) < hs && Math.abs(my - c.y) < hs) return { type: 'corner', name: c.name };
      }
      if (mx > crop.x && mx < crop.x+crop.w && my > crop.y && my < crop.y+crop.h) return { type: 'move' };
      return null;
    }

    function ptFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: (touch.clientX - rect.left) * (cw / rect.width),
        y: (touch.clientY - rect.top)  * (ch / rect.height),
      };
    }

    canvas.addEventListener('mousedown', e => {
      const pt = ptFromEvent(e);
      const hit = hitTest(pt.x, pt.y);
      if (hit) { drag = { hit, startPt: pt, startCrop: { ...crop } }; e.preventDefault(); }
    });
    canvas.addEventListener('touchstart', e => {
      const pt = ptFromEvent(e);
      const hit = hitTest(pt.x, pt.y);
      if (hit) { drag = { hit, startPt: pt, startCrop: { ...crop } }; e.preventDefault(); }
    }, { passive: false });

    function onMove(e) {
      if (!drag) return;
      const pt = ptFromEvent(e);
      const dx = pt.x - drag.startPt.x, dy = pt.y - drag.startPt.y;
      const sc = drag.startCrop;
      if (drag.hit.type === 'move') {
        crop.x = Math.max(0, Math.min(cw - crop.w, sc.x + dx));
        crop.y = Math.max(0, Math.min(ch - crop.h, sc.y + dy));
      } else {
        let nx = sc.x, ny = sc.y, nw = sc.w, nh = sc.h;
        const n = drag.hit.name;
        if (n === 'nw') { nx = sc.x + dx; nw = sc.w - dx; ny = sc.y + dy; nh = sc.h - dy; }
        if (n === 'ne') { nw = sc.w + dx; ny = sc.y + dy; nh = sc.h - dy; }
        if (n === 'sw') { nx = sc.x + dx; nw = sc.w - dx; nh = sc.h + dy; }
        if (n === 'se') { nw = sc.w + dx; nh = sc.h + dy; }
        if (nw < 20) nw = 20;
        if (nw / aspect < 20) nw = 20 * aspect;
        nh = nw / aspect;
        nx = Math.max(0, Math.min(cw - nw, nx));
        ny = Math.max(0, Math.min(ch - nh, ny));
        nw = Math.min(cw - nx, nw);
        nh = nw / aspect;
        if (ny + nh > ch) { nh = ch - ny; nw = nh * aspect; }
        crop = { x: nx, y: ny, w: nw, h: nh };
      }
      draw();
    }
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('touchmove', onMove, { passive: false });
    function onUp() { drag = null; }
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchend', onUp);

    function doRotate(delta) {
      drag = null;
      rotationDeg = ((rotationDeg + delta) % 360 + 360) % 360;
      updateSize();
      canvas.width = cw; canvas.height = ch;
      crop = fitCrop(cw, ch, aspect);
      draw();
    }

    const overlay = el('div', { className: 'kb-overlay' });
    const modal   = el('div', { className: 'kb-modal staffdossier-crop-modal' });
    const hdr     = el('div', { className: 'kb-modal__hdr' });
    hdr.appendChild(el('span', null, title));
    const body = el('div', { className: 'kb-modal__body staffdossier-crop-wrap' });
    body.appendChild(canvas);
    const rotRow = el('div', { className: 'staffdossier-crop-rot' });
    rotRow.append(
      el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm', onClick: () => doRotate(-90) }, S('crop-rotate-ccw-90')),
      el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm', onClick: () => doRotate(90)  }, S('crop-rotate-cw-90')),
      el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm', onClick: () => doRotate(-1)  }, S('crop-rotate-ccw-1')),
      el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm', onClick: () => doRotate(1)   }, S('crop-rotate-cw-1')),
    );
    body.appendChild(rotRow);
    const footer = el('div', { className: 'kb-modal__footer' });
    let resolved = false;
    function cleanup() { overlay.remove(); document.removeEventListener('keydown', onKey); }
    function resolve(result) {
      if (resolved) return; resolved = true;
      cleanup();
      if (result !== 'confirm') return;
      const rad = rotationDeg * Math.PI / 180;
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
      const rotW = Math.round(nw * cos + nh * sin);
      const rotH = Math.round(nw * sin + nh * cos);
      const rotCanvas = document.createElement('canvas');
      rotCanvas.width = rotW; rotCanvas.height = rotH;
      const rotCtx = rotCanvas.getContext('2d');
      rotCtx.translate(rotW / 2, rotH / 2);
      rotCtx.rotate(rad);
      rotCtx.drawImage(img, -nw / 2, -nh / 2);
      const sx = crop.x * scaleX, sy = crop.y * scaleY;
      const sw = crop.w * scaleX, sh = crop.h * scaleY;
      const off = document.createElement('canvas');
      off.width = Math.round(sw); off.height = Math.round(sh);
      off.getContext('2d').drawImage(rotCanvas, sx, sy, sw, sh, 0, 0, off.width, off.height);
      const dataUrl = off.toDataURL('image/jpeg', 0.85);
      if (mode === 'photo') {
        state.personal.photo = dataUrl;
        const box = document.getElementById('photo-preview-box');
        if (box) { box.innerHTML = ''; box.appendChild(el('img', { src: dataUrl, alt: '' })); }
        const btns = box && box.nextElementSibling;
        if (btns) {
          btns.innerHTML = '';
          btns.appendChild(el('button', { type: 'button', className: 'kb-btn kb-btn--ghost kb-btn--sm',
            onClick: () => openCropper('photo') }, S('btn-crop-photo')));
        }
      } else {
        state.documents[docIdx].scan = dataUrl;
        const scanArea = document.getElementById('scan-area-' + docIdx);
        if (scanArea) refreshScanArea(scanArea, docIdx);
      }
    }
    footer.append(
      el('button', { className: 'kb-btn kb-btn--ghost',   onClick: () => resolve('cancel')  }, S('crop-cancel')),
      el('button', { className: 'kb-btn kb-btn--primary', onClick: () => resolve('confirm') }, S('crop-confirm'))
    );
    modal.append(hdr, body, footer);
    overlay.appendChild(modal);
    overlay.addEventListener('click', e => { if (e.target === overlay) resolve('cancel'); });
    function onKey(e) { if (e.key === 'Escape') resolve('cancel'); }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    footer.querySelector('.kb-btn--primary').focus();
  };
  img.src = src;
}

function fitCrop(cw, ch, aspect) {
  let w = cw, h = cw / aspect;
  if (h > ch) { h = ch; w = ch * aspect; }
  return { x: (cw - w) / 2, y: (ch - h) / 2, w, h };
}

// ── Download (HTML output) ─────────────────────────────────────────────────
function onDownload() {
  const html = buildOutputHtml();
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: 'dossier.html' });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addrOneLiner(addr) {
  if (!addr || typeof addr !== 'object') return '';
  return [addr.line1, addr.city, addr.province, addr.postalCode, addr.country]
    .filter(Boolean).join(', ');
}

function docValidityClass(doc) {
  if (!doc.expiryDate) return 'none';
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(doc.expiryDate + 'T00:00:00');
  const warnMs = getWarningMonths(doc.type) * 30.44 * 86400000;
  if (exp < today) return 'exp';
  if (exp - today < warnMs) return 'warn';
  return 'ok';
}

function docValidityText(doc) {
  if (!doc.expiryDate) return 'No expiry date';
  const d = formatDate(doc.expiryDate);
  const cls = docValidityClass(doc);
  if (cls === 'exp')  return 'EXPIRED';
  if (cls === 'warn') return 'Expires ' + d;
  return 'Valid until ' + d;
}

function buildOutputHtml() {
  const p = state.personal;
  const e = state.employment;
  const org = CFG.organization || 'Center for Asylum Protection';
  const name = p.name || 'Staff';

  const photoHtml = p.photo
    ? `<div class="hdr-photo" onclick="openLightbox(this.querySelector('img').src)" style="cursor:zoom-in"><img src="${p.photo}" alt="Staff photo"></div>`
    : '';

  const addr = p.address && typeof p.address === 'object' ? p.address : {};
  const addrParts = [addr.line1, [addr.city, addr.province].filter(Boolean).join(', '),
    addr.postalCode, addr.country].filter(Boolean);

  // ── Personal section ──────────────────────────────────────────────
  let personalHtml = `<div class="card">
  <div class="card-title">Personal Information</div>
  <table>`;
  if (p.name)  personalHtml += `<tr><th>Full name</th><td>${esc(p.name)}</td></tr>`;
  if (p.email) personalHtml += `<tr><th>Email</th><td><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></td></tr>`;
  if (p.phone) personalHtml += `<tr><th>Phone</th><td>${esc(p.phone)}</td></tr>`;
  if (addrParts.length) {
    personalHtml += `<tr><th>Address</th><td>${addrParts.map(esc).join('<br>')}</td></tr>`;
  }
  personalHtml += `</table></div>`;

  if (p.education && p.education.length) {
    personalHtml += `<div class="card"><div class="card-title">Education</div><table>
    <tr><th style="width:auto">Institution</th><th style="width:auto">Qualification</th><th style="width:80px">Year</th></tr>`;
    p.education.forEach(ed => {
      personalHtml += `<tr><td>${esc(ed.institution)}</td><td>${esc(ed.qualification)}</td><td>${esc(ed.year)}</td></tr>`;
    });
    personalHtml += `</table></div>`;
  }

  if (p.workHistory && p.workHistory.length) {
    personalHtml += `<div class="card"><div class="card-title">Prior Work History</div><div class="accordion">`;
    p.workHistory.forEach(w => {
      const from = w.from ? formatDate(w.from, 'MMM YYYY') : '';
      const to   = w.to   ? formatDate(w.to,   'MMM YYYY') : 'present';
      personalHtml += `<details><summary>
        <span>${esc(w.employer || '—')} <span class="sum-role">· ${esc(w.role || '—')}</span></span>
        <span class="sum-dates">${esc(from)}${from||to ? ' – ' : ''}${esc(to)}</span>
      </summary><div class="acc-body"><table>`;
      if (w.employer) personalHtml += `<tr><th>Employer</th><td>${esc(w.employer)}</td></tr>`;
      if (w.role)     personalHtml += `<tr><th>Role</th><td>${esc(w.role)}</td></tr>`;
      if (w.from)     personalHtml += `<tr><th>From</th><td>${esc(formatDate(w.from))}</td></tr>`;
      if (w.to)       personalHtml += `<tr><th>To</th><td>${esc(formatDate(w.to))}</td></tr>`;
      personalHtml += `</table></div></details>`;
    });
    personalHtml += `</div></div>`;
  }

  const ec = p.emergencyContact || {};
  if (ec.name || ec.phone || ec.email) {
    personalHtml += `<div class="card"><div class="card-title">Emergency Contact / Next of Kin</div><table>`;
    if (ec.name)         personalHtml += `<tr><th>Name</th><td>${esc(ec.name)}</td></tr>`;
    if (ec.relationship) personalHtml += `<tr><th>Relationship</th><td>${esc(ec.relationship)}</td></tr>`;
    if (ec.phone)        personalHtml += `<tr><th>Phone</th><td>${esc(ec.phone)}</td></tr>`;
    if (ec.email)        personalHtml += `<tr><th>Email</th><td><a href="mailto:${esc(ec.email)}">${esc(ec.email)}</a></td></tr>`;
    personalHtml += `</table></div>`;
  }

  // ── Employment section ────────────────────────────────────────────
  let employmentHtml = `<div class="card"><div class="card-title">Employment at CAP</div><table>`;
  if (e.hireDate)       employmentHtml += `<tr><th>Hire date</th><td>${esc(formatDate(e.hireDate))}</td></tr>`;
  if (e.probationEnd)   employmentHtml += `<tr><th>Probation end</th><td>${esc(formatDate(e.probationEnd))}</td></tr>`;
  if (e.contractType)   employmentHtml += `<tr><th>Contract type</th><td>${esc(e.contractType)}</td></tr>`;
  if (e.currentRole)    employmentHtml += `<tr><th>Current role</th><td>${esc(e.currentRole)}</td></tr>`;
  if (e.eligibleForRehire) employmentHtml += `<tr><th>Eligible for rehire</th><td>${esc(e.eligibleForRehire)}</td></tr>`;
  employmentHtml += `</table></div>`;

  if (e.roleHistory && e.roleHistory.length) {
    employmentHtml += `<div class="card"><div class="card-title">Role History</div>
    <table><tr><th style="width:auto">Role</th><th>From</th><th>To</th></tr>`;
    e.roleHistory.forEach(r => {
      employmentHtml += `<tr><td>${esc(r.role)}</td><td>${esc(formatDate(r.from))}</td><td>${esc(formatDate(r.to))}</td></tr>`;
    });
    employmentHtml += `</table></div>`;
  }

  if (e.terminationDate || e.terminationReason) {
    employmentHtml += `<div class="card"><div class="card-title">Termination</div><table>`;
    if (e.terminationDate)   employmentHtml += `<tr><th>Date</th><td>${esc(formatDate(e.terminationDate))}</td></tr>`;
    if (e.terminationReason) employmentHtml += `<tr><th>Reason</th><td>${esc(e.terminationReason)}</td></tr>`;
    employmentHtml += `</table></div>`;
  }

  // ── Documents section ─────────────────────────────────────────────
  let documentsHtml = '';
  state.documents.forEach(doc => {
    const cls  = docValidityClass(doc);
    const text = docValidityText(doc);
    documentsHtml += `<div class="card">
    <div class="doc-hdr">
      <span class="doc-name">${esc(doc.type || 'Document')}</span>
      <span class="validity validity-${esc(cls)}">${esc(text)}</span>
    </div>
    <div class="doc-body">
      <table>`;
    if (doc.number)         documentsHtml += `<tr><th>Number</th><td>${esc(doc.number)}</td></tr>`;
    if (doc.issueDate)      documentsHtml += `<tr><th>Issue date</th><td>${esc(formatDate(doc.issueDate))}</td></tr>`;
    if (doc.issueAuthority) documentsHtml += `<tr><th>Issuing authority</th><td>${esc(doc.issueAuthority)}</td></tr>`;
    if (doc.expiryDate)     documentsHtml += `<tr><th>Expiry date</th><td>${esc(formatDate(doc.expiryDate))}</td></tr>`;
    documentsHtml += `</table>`;
    if (doc.scan) documentsHtml += `<img class="doc-thumb" src="${doc.scan}" alt="Document scan" onclick="openLightbox(this.src)">`;
    documentsHtml += `</div></div>`;
  });
  if (!documentsHtml) documentsHtml = `<p class="empty">No documents recorded.</p>`;

  // ── Reviews section ───────────────────────────────────────────────
  let reviewsHtml = '';
  if (state.reviews.length) {
    const sorted = [...state.reviews].sort((a, b) => {
      if (!a.date) return 1; if (!b.date) return -1;
      return b.date.localeCompare(a.date);
    });
    reviewsHtml += `<div class="card"><div class="card-title">Performance Reviews</div><div class="accordion">`;
    sorted.forEach(r => {
      const dateStr    = r.date ? formatDate(r.date) : '—';
      const outcomeStr = r.outcome || '';
      reviewsHtml += `<details><summary>
        <span>${esc(dateStr)}${outcomeStr ? ' — ' + esc(outcomeStr) : ''}</span>
        <span class="sum-dates">${esc(r.venue || '')}</span>
      </summary><div class="acc-body"><table>`;
      if (r.date)      reviewsHtml += `<tr><th>Date</th><td>${esc(formatDate(r.date))}</td></tr>`;
      if (r.venue)     reviewsHtml += `<tr><th>Venue</th><td>${esc(r.venue)}</td></tr>`;
      if (r.reviewers) reviewsHtml += `<tr><th>Reviewer(s)</th><td>${esc(r.reviewers)}</td></tr>`;
      if (r.outcome)   reviewsHtml += `<tr><th>Outcome</th><td>${esc(r.outcome)}</td></tr>`;
      if (r.narrative) reviewsHtml += `<tr><th>Narrative</th><td style="white-space:pre-wrap">${esc(r.narrative)}</td></tr>`;
      if (r.link)      reviewsHtml += `<tr><th>Record</th><td><a href="${esc(r.link)}">${esc(r.link)}</a></td></tr>`;
      reviewsHtml += `</table></div></details>`;
    });
    reviewsHtml += `</div></div>`;
  } else {
    reviewsHtml = `<p class="empty">No reviews recorded.</p>`;
  }

  // ── Files section ─────────────────────────────────────────────────
  let filesHtml = '';
  if (state.documentLinks.length) {
    filesHtml += `<div class="card"><div class="card-title">Document Links</div><ul>`;
    state.documentLinks.forEach(f => {
      if (f.url) filesHtml += `<li><a href="${esc(f.url)}">${esc(f.label || f.url)}</a></li>`;
      else if (f.label) filesHtml += `<li>${esc(f.label)}</li>`;
    });
    filesHtml += `</ul></div>`;
  } else {
    filesHtml = `<p class="empty">No document links recorded.</p>`;
  }

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(name)} — Staff Dossier — ${esc(org)}</title>
<style>
:root{--accent:#2f6fed;--surface:#fff;--surface-2:#f4f6fb;--border:#e0e6f0;--text:#1a1d21;--muted:#6b7280;--success-bg:#dcfce7;--success-fg:#166534;--warn-bg:#fef9c3;--warn-fg:#854d0e;--exp-bg:#fee2e2;--exp-fg:#991b1b;--none-bg:#f1f5f9;--none-fg:#64748b;}
*,*::before,*::after{box-sizing:border-box;}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6;color:var(--text);background:var(--surface-2);margin:0;}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 56px;}
/* Header */
.hdr{display:flex;gap:20px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.hdr-photo{width:88px;height:113px;border-radius:6px;overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
.hdr-photo img{width:100%;height:100%;object-fit:cover;}
.hdr-identity{min-width:0;}
.hdr-identity h1{margin:0 0 4px;font-size:22px;font-weight:700;color:var(--text);}
.hdr-identity .role{font-size:15px;color:var(--accent);font-weight:600;margin-bottom:2px;}
.hdr-identity .meta{font-size:13px;color:var(--muted);}
.hdr-org{margin-left:auto;text-align:right;flex-shrink:0;}
.hdr-org .org-name{font-size:13px;font-weight:700;color:var(--muted);}
.hdr-org .org-sub{font-size:12px;color:var(--muted);}
/* Tabs */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab-btn{padding:9px 18px;font:600 13px/1 system-ui,sans-serif;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:#eef4ff;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:18px 20px;margin-bottom:14px;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.card-title::before{content:'';display:block;width:3px;height:13px;border-radius:2px;background:var(--accent);flex-shrink:0;}
/* Tables */
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:7px 10px;font-size:13px;border-bottom:1px solid #f0f2f6;vertical-align:top;}
th{font-weight:600;color:var(--muted);width:180px;white-space:nowrap;}
tr:last-child th,tr:last-child td{border-bottom:none;}
/* Validity */
.doc-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.doc-name{font-size:16px;font-weight:700;color:var(--text);}
.validity{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;}
.validity-ok  {background:var(--success-bg);color:var(--success-fg);}
.validity-warn{background:var(--warn-bg);color:var(--warn-fg);}
.validity-exp {background:var(--exp-bg);color:var(--exp-fg);}
.validity-none{background:var(--none-bg);color:var(--none-fg);}
.doc-body{display:flex;gap:16px;align-items:flex-start;}
.doc-body table{flex:1;min-width:0;}
.doc-thumb{width:110px;flex-shrink:0;border-radius:4px;border:1px solid var(--border);cursor:zoom-in;display:block;}
/* Accordion */
.accordion{border-top:1px solid var(--border);}
details{border-bottom:1px solid var(--border);}
summary{list-style:none;padding:11px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--text);user-select:none;}
summary::-webkit-details-marker{display:none;}
summary::after{content:'▸';color:var(--muted);font-size:11px;flex-shrink:0;transition:transform .15s;}
details[open]>summary::after{transform:rotate(90deg);}
details[open]>summary{color:var(--accent);}
.sum-role{font-weight:400;color:var(--muted);}
.sum-dates{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;}
.acc-body{padding:6px 6px 14px;}
/* Misc */
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
ul{margin:4px 0;padding-left:20px;}
li{margin-bottom:4px;font-size:13px;}
.empty{color:var(--muted);font-size:13px;padding:4px 0;}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;}
#lb img{max-width:min(90vw,900px);max-height:90vh;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:contain;}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  ${photoHtml}
  <div class="hdr-identity">
    <h1>${esc(name)}</h1>
    ${e.currentRole ? `<div class="role">${esc(e.currentRole)}${e.contractType ? ' · ' + esc(e.contractType) : ''}</div>` : ''}
    ${e.hireDate ? `<div class="meta">Hired ${esc(formatDate(e.hireDate))}</div>` : ''}
    ${e.terminationDate ? `<div class="meta">Terminated ${esc(formatDate(e.terminationDate))}</div>` : ''}
  </div>
  <div class="hdr-org">
    <div class="org-name">${esc(org)}</div>
    <div class="org-sub">Staff Dossier</div>
  </div>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-tab="personal"   onclick="showTab('personal')">Personal</button>
  <button class="tab-btn"        data-tab="employment" onclick="showTab('employment')">Employment</button>
  <button class="tab-btn"        data-tab="documents"  onclick="showTab('documents')">Documents</button>
  <button class="tab-btn"        data-tab="reviews"    onclick="showTab('reviews')">Reviews</button>
  <button class="tab-btn"        data-tab="files"      onclick="showTab('files')">Files</button>
</nav>

<div id="personal"   class="tab-pane active">${personalHtml}</div>
<div id="employment" class="tab-pane">${employmentHtml}</div>
<div id="documents"  class="tab-pane">${documentsHtml}</div>
<div id="reviews"    class="tab-pane">${reviewsHtml}</div>
<div id="files"      class="tab-pane">${filesHtml}</div>

</div>
<script>
function showTab(id){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id===id));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
}
function openLightbox(src){
  const lb=document.createElement('div');
  lb.id='lb';
  lb.onclick=()=>lb.remove();
  const img=document.createElement('img');
  img.src=src;
  lb.appendChild(img);
  document.body.appendChild(lb);
  document.addEventListener('keydown',function h(e){if(e.key==='Escape'){lb.remove();document.removeEventListener('keydown',h);}});
}
<\/script>
<script type="application/json" id="staff-data">
${JSON.stringify(state, null, 2)}
<\/script>
</body>
</html>`;
}

// ── Load dossier ───────────────────────────────────────────────────────────
document.getElementById('load-file-input').addEventListener('change', function() {
  const f = this.files[0];
  if (!f) return;
  this.value = '';
  const reader = new FileReader();
  reader.onload = e => {
    const html = e.target.result;
    try {
      const match = html.match(/<script[^>]+type="application\/json"[^>]+id="staff-data"[^>]*>([\s\S]*?)<\/script>/i);
      if (!match) throw new Error('No staff-data block found in this file.');
      const parsed = JSON.parse(match[1]);
      if (!parsed || typeof parsed !== 'object') throw new Error('staff-data is not a valid JSON object.');
      state = deepMerge(emptyState(), parsed);
      render();
    } catch (err) {
      kbAlert({ title: 'Cannot load dossier', message: err.message });
    }
  };
  reader.readAsText(f);
});

function deepMerge(base, overlay) {
  if (Array.isArray(base) && Array.isArray(overlay)) return overlay;
  if (overlay === null || overlay === undefined) return base;
  if (typeof overlay !== 'object' || typeof base !== 'object') return overlay;
  const result = { ...base };
  for (const k in overlay) {
    if (Object.prototype.hasOwnProperty.call(overlay, k)) {
      result[k] = (k in base && typeof base[k] === 'object' && base[k] !== null)
        ? deepMerge(base[k], overlay[k])
        : overlay[k];
    }
  }
  return result;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrap = el('div', { className: 'kb-wrap' });

  wrap.appendChild(buildToolbar());
  wrap.appendChild(buildHeader());

  // Top action row: Load · New on left, Download on right
  const topActions = el('div', { className: 'staffdossier-top-actions' });
  topActions.append(
    el('button', { type: 'button', className: 'kb-btn kb-btn--ghost',
      onClick: () => document.getElementById('load-file-input').click() }, S('load')),
    el('button', { type: 'button', className: 'kb-btn kb-btn--ghost',
      onClick: onNew }, S('new')),
    el('div', { className: 'spacer' }),
    el('button', { type: 'button', className: 'kb-btn kb-btn--primary', onClick: onDownload }, S('save'))
  );
  wrap.appendChild(topActions);

  const tabs = [
    { label: S('tab-personal'),   build: buildPersonalTab },
    { label: S('tab-employment'), build: buildEmploymentTab },
    { label: S('tab-documents'),  build: buildDocumentsTab },
    { label: S('tab-reviews'),    build: buildReviewsTab },
    { label: S('tab-files'),      build: buildFilesTab },
  ];
  wrap.appendChild(makeTabs(tabs));

  // Bottom action row
  const actions = el('div', { className: 'kb-actions', style: { marginTop: '20px' } });
  actions.appendChild(el('button', { type: 'button', className: 'kb-btn kb-btn--primary', onClick: onDownload }, S('save')));
  wrap.appendChild(actions);

  wrap.appendChild(buildFooter());
  app.appendChild(wrap);
  updateThemeIcon();
}

async function onNew() {
  const ok = await kbConfirm({ message: S('confirm-new') });
  if (!ok) return;
  state = emptyState();
  render();
}

function buildToolbar() {
  const toolbar = el('div', { className: 'kb-toolbar' });
  const langSel = el('select', { className: 'kb-select', 'aria-label': 'Language' });
  (CFG.languages || []).forEach(l => {
    const o = el('option', { value: l.code }, l.name || l.code);
    if (l.code === lang) o.selected = true;
    langSel.appendChild(o);
  });
  langSel.addEventListener('change', () => {
    applyLang(langSel.value);
    localStorage.setItem('staffdossier-lang', langSel.value);
    render();
  });
  const { seg: sizeSeg, label: szLabel } = makeSizeControl();
  toolbar.append(langSel, el('div', { className: 'spacer' }), sizeSeg, szLabel,
    makeThemeButton(), makeAboutButton(showAboutModal));
  return toolbar;
}

function buildHeader() {
  const header = el('header', { className: 'kb-header' });
  const brand = el('div', { className: 'kb-brand' });
  const tile = el('span', { className: 'logo' }); tile.innerHTML = KB_BRAND_SVG;
  const org = el('span', { className: 'org' });
  org.appendChild(document.createTextNode(CFG.organization || 'Staff Dossier'));
  const small = el('small'); small.textContent = CFG.tagline || S('subtitle');
  org.appendChild(small);
  brand.append(tile, org);
  const title = el('div', { className: 'kb-doctitle' });
  title.appendChild(el('h1', null, 'Staff Dossier'));
  header.append(brand, title);
  return header;
}

function buildFooter() {
  const sep = () => el('span', { className: 'sep' }, '·');
  const footer = el('footer', { className: 'kb-footer' });
  const mark = el('span', { className: 'kb-mark' }); mark.innerHTML = KB_FOOTER_MARK_SVG + 'kBenestad';
  footer.append(
    mark,
    sep(), el('span', null, '© 2026 Kristian Benestad'),
    sep(), el('a', { href: 'https://github.com/kbenestad/bizdocs', target: '_blank', rel: 'noopener' }, 'kbenestad/bizdocs'),
    sep(), el('button', { type: 'button', onClick: showAboutModal }, CFG['about-title'] || 'About')
  );
  return footer;
}

// ── Boot ───────────────────────────────────────────────────────────────────
try {
  CFG = await loadYamlConfig();
  assertValidConfig(CFG);
  normaliseConfig();
  applyAccent(CFG);
  initFontScale();
  lang = localStorage.getItem('staffdossier-lang') || CFG['default-code'] || 'en';
  applyLang(lang);
  render();
} catch (e) {
  document.getElementById('app').innerHTML =
    `<div class="kb-wrap"><div class="kb-note kb-note--error"><span>⚠</span>` +
    `<div><b>Failed to load config.yml</b><br>${e.message}</div></div></div>`;
}
})();
</script>
</body>
</html>
