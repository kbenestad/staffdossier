  en:
    about:
      title: About
      button: Close
      content: |
        ### Staff Dossier
        Creates, edits, and downloads staff dossier files for **Center for Asylum Protection**. Each dossier is a self-contained HTML file that embeds the staff record and any scanned identity documents.

        Load an existing dossier to edit it; download to save a new version.
